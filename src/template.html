<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Manager</title>
</head>
<body>
    <button type="button" id="test-btn">Test Button</button>
    <div id="sidebar">
        <h3>My Projects</h3>
        <button type="button" id="add-project-btn">+</button>
        <p>Project list here</p>
        <button type="button" id="projects-test-btn">Render Test Button</button>
    </div>
    <div id="main">
        <h1>My To-Do</h1>
        <button type="button" id="add-td-btn">+</button>
        <div>
            <div id="upcoming-tasks" class="container">
                <h3>Upcoming</h3>
                <button type="button" id="upcoming-test-btn">Render Test Button</button>
            </div>
            <div id="overdue-tasks" class="container">
                <h3>Overdue</h3>
                <button type="button" id="overdue-test-btn">Render Test Button</button>
            </div>
        </div>
        <template id="todo-template">
            <div class="todo-container">
                <button type="button" class="check-btn">Check</button>
                <span>Task Title</span>
                <button type="button" class="edit-btn">Edit</button>
                <button type="button" class="delete-btn">Delete</button>
            </div>
        </template>
        <template id="side-project-template">
            <div class="side-project-container">
                <span>Project Title</span>
            </div>
        </template>
    </div>
</body>
</html>
