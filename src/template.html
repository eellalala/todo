<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Manager</title>
</head>
<body>
    <button type="button" id="test-btn">Test Button</button>
    <div id="sidebar">
        <h3>My Projects</h3>
        <p>Project list here</p>
    </div>
    <div id="main">
        <h1>My To-Do</h1>
        <div id="upcoming-tasks" class="container">
            <h3>Upcoming</h3>
            <ul id="upcoming-list" class="task-list"></ul>
            <p>tasks here</p>
            <button type="button" id="upcoming-test-btn">Render Test Button</button>
        </div>
        <div id="overdue-tasks" class="container">
            <h3>Overdue</h3>
             <ul id="overdue-list" class="task-list"></ul>
            <p>tasks here</p>
            <button type="button" id="overdue-test-btn">Render Test Button</button>
        </div>
    </div>
</body>
</html>
